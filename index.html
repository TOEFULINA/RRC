<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOEFU</title>
<link rel="stylesheet" href="style.css?v=2026-09-03desk5" />
  <link rel="stylesheet" href="stations.css?v=2026-09-03desk5" />
<!-- Ported Skyrim-compass portfolio, scoped to #pause-menu-root only (see
     menu.css's own header comments for how the scoping works) — it does
     NOT affect anything above. -->
<link rel="stylesheet" href="menu.css?v=2026-09-03desk5" />
<!-- Glue styles new to this combined project: pause button, the room's
     blur/dim-on-pause filter, and #pause-menu-root's own fade transition. -->
<link rel="stylesheet" href="pause-bridge.css?v=2026-09-03desk5" />
</head>
<body>

  <!-- Loading screen: the Game Boy boot, beat for beat.
       2026 is already on screen (the Nintendo(R) slot), then the letters fly
       in one at a time from above — large, each its own colour, shrinking into
       place — and once the word is assembled it resolves into a single
       gradient and a prism passes over it. Each letter is its own span so it
       can carry its own delay and colour; --i is its position in the queue. -->
  <div id="loading-screen">
    <div class="loading-inner">
      <div class="gb-word" data-text="TOEFULINA">
        <span style="--i:0">T</span>
        <span style="--i:1">O</span>
        <span style="--i:2">E</span>
        <span style="--i:3">F</span>
        <span style="--i:4">U</span>
        <span style="--i:5">L</span>
        <span style="--i:6">I</span>
        <span style="--i:7">N</span>
        <span style="--i:8">A</span>
      </div>
      <div class="gb-sub">PORTFOLIO 2026</div>
      <div class="loading-sub"></div>
    </div>
  </div>

  <!-- Crate flippers. Only visible while a record is pulled out (see
       updateVinylNav in js/main.js) — arrow keys do the same on desktop, but
       a phone has none, and this is the one place in the room with a sequence
       to move through. -->
  <div id="vinyl-nav" aria-hidden="true">
    <button id="vinyl-prev" type="button" aria-label="Previous record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" /></svg>
    </button>
    <div id="vinyl-count"></div>
    <button id="vinyl-next" type="button" aria-label="Next record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" /></svg>
    </button>
  </div>

  <!-- The "what do you want to do?" choice screen is gone - the room
       wakes up on its own now (see startSeatedIntro in js/main.js), and
       the ported Skyrim pause menu (js/menu/) is the real navigation. -->

  <div id="mobile-controls">
    <button id="mc-w" class="mc-btn mc-w" aria-label="walk forward">&#9650;</button>
    <button id="mc-a" class="mc-btn mc-a" aria-label="walk left">&#9664;</button>
    <button id="mc-s" class="mc-btn mc-s" aria-label="walk back">&#9660;</button>
    <button id="mc-d" class="mc-btn mc-d" aria-label="walk right">&#9654;</button>
  </div>

  <canvas id="scene"></canvas>

  <!-- Opens the pause menu — same action as pressing Escape while free-
       roaming, but works on touch devices with no keyboard. Revealed once
       you're up and walking (see main.js, same moment #mobile-controls
       shows). -->
  <button id="pause-open-btn" aria-label="Open menu">Menu</button>


  <!-- Skyrim-style pause menu — this is the ported compass-portfolio
       (see js/menu/). Hidden/inert until pauseState.js marks it open;
       #bg-layer's background is set at that moment to a snapshot of
       whatever the room canvas was just showing (see js/main.js), so it
       reads as "the room, paused" rather than a fixed backdrop image —
       except on the Skills screen, which swaps in its own nebula backdrop
       exactly like the standalone compass site did (see skillsView.js). -->
  <div id="pause-menu-root" class="menu-inverted">
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <div id="app"></div>
    <button id="pause-close-btn" class="rune" aria-label="Resume">Resume</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="js/main.js?v=2026-09-03desk5"></script>
  <script type="module" src="js/menu/main.js?v=2026-09-03desk5"></script>
</body>
</html>
