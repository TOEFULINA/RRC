<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>the room — portfolio</title>
<link rel="stylesheet" href="style.css?v=2026-09-02sp1" />
<!-- Ported Skyrim-compass portfolio, scoped to #pause-menu-root only (see
     menu.css's own header comments for how the scoping works) — it does
     NOT affect anything above. -->
<link rel="stylesheet" href="menu.css?v=2026-09-02sp1" />
<!-- Glue styles new to this combined project: pause button, the room's
     blur/dim-on-pause filter, and #pause-menu-root's own fade transition. -->
<link rel="stylesheet" href="pause-bridge.css?v=2026-09-02sp1" />
</head>
<body>

  <div id="loading-screen">
    <div class="loading-inner">
      <!-- Rendered at 72x72 and blown up by CSS - see js/loaderSpin.js -->
      <canvas id="loading-spin" width="72" height="72"></canvas>
      <div class="loading-sub"></div>
    </div>
    <div class="loading-byline">TOEFU LINA 2026</div>
  </div>

  <!-- The "what do you want to do?" choice screen is gone - the room
       wakes up on its own now (see startSeatedIntro in js/main.js), and
       the ported Skyrim pause menu (js/menu/) is the real navigation. -->

  <div id="mobile-controls">
    <button id="mc-w" class="mc-btn mc-w" aria-label="walk forward">&#9650;</button>
    <button id="mc-a" class="mc-btn mc-a" aria-label="walk left">&#9664;</button>
    <button id="mc-s" class="mc-btn mc-s" aria-label="walk back">&#9660;</button>
    <button id="mc-d" class="mc-btn mc-d" aria-label="walk right">&#9654;</button>
  </div>

  <canvas id="scene"></canvas>

  <!-- Opens the pause menu — same action as pressing Escape while free-
       roaming, but works on touch devices with no keyboard. Revealed once
       you're up and walking (see main.js, same moment #mobile-controls
       shows). -->
  <button id="pause-open-btn" aria-label="Open menu">Menu</button>


  <!-- Skyrim-style pause menu — this is the ported compass-portfolio
       (see js/menu/). Hidden/inert until pauseState.js marks it open;
       #bg-layer's background is set at that moment to a snapshot of
       whatever the room canvas was just showing (see js/main.js), so it
       reads as "the room, paused" rather than a fixed backdrop image —
       except on the Skills screen, which swaps in its own nebula backdrop
       exactly like the standalone compass site did (see skillsView.js). -->
  <div id="pause-menu-root" class="menu-inverted">
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <div id="app"></div>
    <button id="pause-close-btn" class="rune" aria-label="Resume">Resume</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="js/main.js?v=2026-09-02sp1"></script>
  <script type="module" src="js/menu/main.js?v=2026-09-02sp1"></script>
</body>
</html>
